[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relperm"
version = "0.6.0"
description = "Corey / LET relative permeability and Brooks-Corey / Leverett J capillary pressure with interactive editor and Eclipse / tNavigator table export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest", "pandas>=1.3", "openpyxl"]
scal = ["pandas>=1.3", "openpyxl"]

[project.scripts]
relperm = "relperm.cli:main"

[project.gui-scripts]
relperm-gui = "relperm.app:main"

[tool.setuptools]
packages = ["relperm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
